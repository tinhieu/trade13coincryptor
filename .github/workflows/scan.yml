name: Tweezer Bollinger Scan

on:
  schedule:
    # Chạy mỗi 15 phút. GitHub Actions không đảm bảo đúng giờ tuyệt đối (có thể trễ vài phút
    # vào giờ cao điểm) — phù hợp cho khung 15m trở lên. Đổi "*/15" thành "*/5" nếu muốn quét
    # thường xuyên hơn (tối thiểu GitHub cho phép là 5 phút).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" để chạy thử thủ công

permissions:
  contents: write   # cần quyền này để commit lại file alert_state.json (chống báo trùng)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan (1 lượt)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SINGLE_RUN: "1"
        run: python tweezer_bot.py

      - name: Lưu lại trạng thái đã cảnh báo (chống báo trùng)
        run: |
          git config user.name "tweezer-bot"
          git config user.email "tweezer-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain alert_state.json)" ]; then
            git add alert_state.json
            git commit -m "Cập nhật trạng thái cảnh báo [skip ci]"
            git push
          else
            echo "Không có thay đổi để lưu."
          fi
